- id: SP9-505
  title: "Wi-Fi and Bluetooth instability (iwlwifi crash on resume, dropouts, BT device drops)"
  area: wireless
  kind: bug
  status: needs-test
  priority: P3
  layers: {mainline: partial, linux_surface: partial, fedora: partial}
  problem: |
    Reports of iwlwifi crashing on resume on Alder Lake-P CNVi, Wi-Fi dropping on connect, and Bluetooth mice
    disconnecting.
  origin: |
    Mostly generic Intel AX211 / iwlwifi firmware issues, not Surface-specific; BT mouse drops are autosuspend.
  reports:
    - "#1973 | iwlwifi crash on resume (ADL-P CNVi): iwlmvm power_scheme=1 made it rarer"
    - "#1503 | SP9 Wi-Fi off on connect: pinning linux-firmware 20240610 helped (2024)"
    - "#1405 | SP9 dropouts: separate 2.4 and 5 GHz SSIDs (closed)"
    - "#1178 | SP9 BT mouse drops: autosuspend rule"
    - "#1988 | SP9 BT disconnects: re-pair (closed)"
    - "#1794 | SP9 Debian 12 AX211 after kernel swap"
  fixes: []
  solutions:
    - "If it reproduces on current Fedora, report to iwlwifi (Intel) with firmware version; not a Surface upstreaming item."
  next:
    - "Watch during daily use."
  upstream: ["iwlwifi (Intel)", "BlueZ"]
  people: []
  depends_on: []
  related: [SP9-110]
  kb: ["status.yaml"]
