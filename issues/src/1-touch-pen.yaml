- id: SP9-101
  title: "Touchscreen and pen need the out-of-tree ITHC driver (no upstream driver for the ADL THC in legacy mode)"
  area: touch
  kind: missing-driver
  status: open
  priority: P1
  layers: {mainline: broken, linux_surface: works, fedora: broken}
  problem: |
    On a stock kernel the SP9 touchscreen and Slim Pen 2 do not work at all. The touch controller is the
    Alder Lake-P Touch Host Controller (PCI 8086:51d0), which only the downstream `ithc` driver
    (linux-surface 0006, quo/ithc-linux) drives. With ITHC but without iptsd, touch is single-touch only.
  origin: |
    Intel never upstreamed THC support for Alder Lake. Intel's `intel-thc-hid` (QuickSPI/QuickI2C, mainline
    since 6.14, Even Xu) only claims Meteor Lake and newer. The SP9 runs its THC in legacy mode
    ("no ACPI config, using legacy mode", seen in #2367), which `intel-thc-hid` does not implement. quo,
    who wrote ITHC, will not submit it under a pseudonym (quo/ithc-linux#7), and nobody else has posted it.
    No IPTS or ITHC patch has ever reached linux-input (patchwork search, 2026-11-14).
  reports:
    - "disc#2282 | single touch without iptsd"
    - "#1330 | SP9 touch and pen dead: iptsd missing"
    - "#1848 | SP9 pen dead: no /dev/ipts (UAPI moved to hidraw)"
    - "#1156 | Fedora 38 SP9 pen needs linux-surface kernel plus iptsd"
    - "#818 | SP8 touch and pen support history"
    - "quo/ithc-linux#34 | SL5 (same 8086:51d0) gets zero events on Fedora 44"
    - "intel/thc-drivers#1 | Intel's out-of-tree THC drivers, Surface report unanswered"
  fixes:
    - "quo/ithc-linux#7 | upstreaming tracker, open since 2022"
    - "quo/ithc-linux#29 | Intel QuickSPI driver: ADL QuickSPI easy, legacy mode needs ithc-legacy.c merged"
    - "quo/ithc-linux#33 | PR: error recovery and locking; quo's review sets the bar for an upstream version"
    - "kernel#132 | HID based IPTS and ITHC support in linux-surface (downstream, 2022)"
    - "url:https://patchwork.kernel.org/project/linux-input/list/?series=909501 | Intel THC drivers v2 (Even Xu), mainline 6.14, MTL and newer only"
  solutions:
    - "Short term on stock Fedora: build quo/ithc-linux out of tree and sign it with a MOK, as John-S-Reddick/bazzite-surface does; package it as an akmod/kmod (RPM Fusion or Terra) until it is upstream."
    - "Long term option A: someone carries ITHC to linux-input as a HID transport driver after the cleanup quo listed (kernel style, error handling, full re-init on error)."
    - "Long term option B: merge ITHC's legacy mode into Intel's intel-thc-hid and add the ADL PCI IDs; ask Even Xu and Xinpeng Sun (Intel) whether they would take it."
  next:
    - "Ask quo whether he would accept someone else submitting ITHC or the legacy-mode merge with his authorship (quo/ithc-linux#7)."
    - "Ask Intel (Even Xu) on linux-input whether legacy-mode THC (ADL, TGL) is welcome in intel-thc-hid."
  upstream: ["linux-input (Jiri Kosina, Benjamin Tissoires)", "Intel THC maintainers (Even Xu, Xinpeng Sun)"]
  people: [quo, StollD, "Even Xu"]
  depends_on: []
  related: [SP9-102, SP9-103, SP9-104, SP9-111, SP9-112]
  kb: ["status.yaml", "docs/subsystems/touch-pen.md", "docs/research/upstream-efforts.md"]

- id: SP9-102
  title: "iptsd is not packaged in Fedora"
  area: touch
  kind: packaging
  status: open
  priority: P1
  layers: {mainline: n/a, linux_surface: works, fedora: broken}
  problem: |
    Multitouch and pen on the SP9 need the iptsd daemon. Fedora does not ship it; users take it from the
    linux-surface repo or Terra.
  origin: |
    Nobody filed a Fedora package review (Red Hat Bugzilla search, 2026-11-14). Repology lists iptsd only in
    AUR, nixpkgs, Solus and Terra. Every build dependency is already in Fedora rawhide: cli11-devel,
    eigen3-devel 5.0.1 (the version iptsd's wrap pins), fmt-devel, inih-cpp, guidelines-support-library-devel,
    spdlog-devel; the optional tools need sdl2-compat and cairomm. No bundling is needed.
  reports:
    - "disc#2282 | iptsd has to come from a third-party repo"
    - "repo#15 | linux-surface Fedora 42 repo was missing iptsd"
    - "ublue-os/bazzite#3426 | iptsd daemon missing on Bazzite"
  fixes:
    - "terrapkg/packages#16814 | Terra iptsd package (spec reference)"
    - "iptsd#120 | upstream announcements for downstream packagers"
  solutions:
    - "Package iptsd for Fedora from upstream 3.1.1 against system libraries; ship the udev rule and iptsd@.service; split the debug tools into a subpackage."
    - "Fix the udev and service issues first or carry them as patches (SP9-105)."
  next:
    - "Write the spec, build in mock against rawhide, file a Review Request in Red Hat Bugzilla."
  commands: |
    git clone https://github.com/linux-surface/iptsd
    fedpkg --release rawhide mockbuild
  upstream: ["Fedora package review"]
  people: [StollD]
  depends_on: []
  related: [SP9-101, SP9-105, SP9-111]
  kb: ["status.yaml", "data/indexes/upstream-efforts.tsv"]

- id: SP9-103
  title: "Touch and pen stop working after suspend/resume"
  area: touch
  kind: bug
  status: open
  priority: P1
  layers: {mainline: n/a, linux_surface: partial, fedora: broken}
  problem: |
    After s2idle resume the touchscreen and pen sometimes stay dead until iptsd or the ITHC module is
    restarted. It is the most repeated unsolved touch problem across the linux-surface trackers.
  origin: |
    Suspected: ITHC tears down and recreates the hid_device on suspend, and iptsd holding the old hidraw
    node can deadlock or keep a dead handle (quo, quo/ithc-linux#20; linux-surface#2210 patch description).
    Firefox-only loss of touch after sleep (#1402) looks like a separate userspace problem.
  reports:
    - "#1171 | touch and pen dead after resume; mentions quo's DMA fix b51f328 (closed not planned)"
    - "iptsd#122 | touch and pen stop after sleep (closed not planned)"
    - "#1799 | SP10 dead touchscreen after resume (closed without fix)"
    - "sebanc/brunch#2202 | SP9 multitouch and pen dead after sleep"
    - "#273 | touch after resume on older devices; quo explains hidraw recreation"
    - "#1402 | SP9: only Firefox loses touch after sleep"
    - "quo/ithc-linux#20 | SP8 touch after suspend; quo switched to full shutdown and reinit on suspend"
  fixes:
    - "#2210 | closed PR carrying 'ithc: Fix PM suspend/resume to preserve hid_device across s2idle' (author never resubmitted)"
    - "kb:orphaned-patches/linux-surface-2210-ithc-pm-preserve-hid-device.patch | the extracted patch, applies to v7.3-surface ITHC (dry run), untested"
  solutions:
    - "Test the orphaned #2210 patch on the SP9 with an rtcwake loop; if it holds, offer it to quo/ithc-linux with the author's agreement."
    - "Workaround: restart iptsd from a systemd sleep hook after resume."
  next:
    - "Reproduce on an SP9 and capture dmesg plus iptsd journal across 10 suspend cycles."
  commands: |
    for i in $(seq 10); do sudo rtcwake -m mem -s 20; sleep 15; journalctl -b -u 'iptsd@*' --since '-1min' | tail -3; done
  upstream: ["quo/ithc-linux", "linux-surface"]
  people: [quo, RowdyRagamuffin]
  depends_on: [SP9-101]
  related: [SP9-104, SP9-302]
  kb: ["docs/research/closed-prs.md", "docs/research/closed-issues.md"]

- id: SP9-104
  title: "ITHC fails to initialise on some boots or units (EFI stub DMA error, legacy init -110)"
  area: touch
  kind: bug
  status: needs-test
  priority: P2
  layers: {mainline: n/a, linux_surface: partial, fedora: n/a}
  problem: |
    Two failure modes are reported on the SP9: with the kernel booted as an EFI stub, ITHC reports
    "invalid dma rx data" and touch never starts; on one unit `ithc_legacy_init` times out with -110 on every
    boot and touch has never worked. A third report: touch locks up while the magnetic charger is attached.
  origin: |
    EFI stub: quo found bit 5 of THC register 0x1128 set only on working boots and committed 18afc6f
    (2024-04, "hopefully fixed"). Legacy init -110 (UEFI 22.107.143, 7.2.15): unknown, no maintainer reply.
    Charger lock-up: unknown.
  reports:
    - "#1078 | SP9 touch dead when booted as EFI stub (still open)"
    - "quo/ithc-linux#26 | same bug on SP9, quo's register analysis, closed after 18afc6f"
    - "#2367 | SP9 ithc_legacy_init failed with -110 on every boot"
    - "#1470 | touchscreen locks up while the magnetic charger is attached"
  fixes:
    - "commit:quo/ithc-linux@18afc6f | likely fix for the EFI stub case"
  solutions:
    - "Retest EFI stub / UKI boot on the SP9 with current ITHC before Fedora moves to UKIs; close #1078 if it works."
  next:
    - "Boot an SP9 once through a UKI or efibootmgr EFI stub entry and check `dmesg | grep ithc`."
  upstream: ["quo/ithc-linux"]
  people: [quo]
  depends_on: [SP9-101]
  related: [SP9-103, SP9-601]
  kb: ["docs/research/upstream-efforts.md"]

- id: SP9-105
  title: "iptsd service and udev rule are fragile (stops after cold boot, probes every hidraw, loses its tag)"
  area: touch
  kind: bug
  status: fix-pending
  priority: P1
  layers: {mainline: n/a, linux_surface: partial, fedora: n/a}
  problem: |
    iptsd@.service can stop itself about 6 s after a cold boot; the udev rule runs iptsd-check-device on every
    hidraw node, which can stall input for seconds or lock the user out at the lock screen; a udev change
    event drops the systemd tag so the service loses its device; raw ITHC input nodes duplicate iptsd's events.
  origin: |
    `StopWhenUnneeded=yes` in the unit, an udev rule matching `ACTION=="add"` only, and a probe that is not
    limited to ITHC/IPTS devices. All have small fixes posted as PRs with no maintainer reply.
  reports:
    - "iptsd#228 | iptsd-check-device causes 6 s bus timeout on AMD SL4 SPI touchscreen"
    - "iptsd#229 | udev rule probes every hidraw node incl. USB; blocking probe locks out the lock screen"
    - "iptsd#163 | service loses access to the device after a change event"
    - "iptsd#220 | duplicate raw ITHC input nodes and 16:9 distortion"
    - "#2299 | IPTS resume -EAGAIN leaves iptsd unkillable (OnFailure= recovery)"
  fixes:
    - "iptsd#219 | remove StopWhenUnneeded=yes (service stops ~6 s after cold boot)"
    - "iptsd#221 | hide raw ITHC input nodes"
    - "iptsd#224 | keep the systemd tag across change events"
  solutions:
    - "Review and test the three PRs on the SP9; ask the iptsd maintainer (StollD) to merge; carry them in the Fedora package meanwhile."
    - "Restrict the udev probe to known THC/IPTS hidraw parents."
  next:
    - "Test #219, #221 and #224 together on the SP9 and post Tested-by on each PR."
  upstream: ["linux-surface/iptsd"]
  people: [StollD, L0g0ff, luqqas96, fildunsky, sangesi]
  depends_on: []
  related: [SP9-102, SP9-106]
  kb: ["docs/research/open-prs.md", "data/indexes/open-prs.tsv"]

- id: SP9-106
  title: "Erratic touch detection and weak palm rejection with default iptsd settings"
  area: touch
  kind: bug
  status: fix-pending
  priority: P2
  layers: {mainline: n/a, linux_surface: partial, fedora: n/a}
  problem: |
    Taps need force, swipes break, palms register while writing, and DisableOnStylus leaves some touches or
    splits gestures. The linux-surface wiki carries an SP9 calibration override as a workaround.
  origin: |
    Contact detection defaults changed in iptsd dd0c322 and are too strict for several devices; a contact
    missed for a single frame ends the touch; DisableOnStylus has edge cases.
  reports:
    - "iptsd#171 | the new contact detection defaults are bad"
    - "iptsd#173 | SP9 Slim Pen 2 palm rejection: docs and proposed defaults"
    - "iptsd#166 | DisableOnStylus does not disable all touch inputs"
    - "iptsd#218 | DisableOnStylus splits one gesture into several"
    - "iptsd#226 | touches interrupted when a contact is missed for one frame (SP8)"
    - "#1862 | SP9: touch feels better without iptsd on GNOME 48"
    - "#1273 | palm rejection lost after iptsd update: recalibrate"
  fixes:
    - "iptsd#234 | adaptive neutral mode"
    - "iptsd#235 | skip detection below the deactivation threshold"
    - "iptsd#214 | DisableOnStylusLevel (by an SP9 user)"
    - "iptsd#227 | retain lost contacts for a few frames (closed, never resubmitted)"
    - "kb:orphaned-patches/iptsd-227-retain-lost-contacts.rebased-on-9c7a554.patch | rebased copy of iptsd#227"
  solutions:
    - "Workaround from the wiki: /etc/iptsd.d/91-calibration.conf with ActivationThreshold 24, DeactivationThreshold 20, OrientationThresholdMax 5; or run iptsd-calibrate."
    - "Test the open PRs plus the orphaned #227 on the SP9 and propose SP9 defaults upstream."
  next:
    - "Run iptsd-calibrate on an SP9 and post the result on the tracking issue."
  commands: |
    sudo iptsd-calibrate $(iptsd-find-hidraw)
  upstream: ["linux-surface/iptsd"]
  people: [StollD, xieve, cunninghamcard-bit, hansakoch]
  depends_on: []
  related: [SP9-105, SP9-107]
  kb: ["docs/research/wiki-digest.md", "docs/research/closed-prs.md"]

- id: SP9-107
  title: "Slim Pen 2 report rate is about 66 Hz (jagged fast strokes)"
  area: pen
  kind: bug
  status: fix-pending
  priority: P2
  layers: {mainline: n/a, linux_surface: partial, fedora: n/a}
  problem: |
    Fast pen strokes come out jagged; measured pen event rate on the SP9 is about 66 Hz.
  origin: |
    iptsd only emits a position for some DFT window types. An SP9 user processes position on every DFT window
    (Position, MPP2 position, pressure and an unknown type) and reaches about 266 to 300 Hz.
  reports:
    - "#1588 | Surface Pen jagged fast lines (low poll rate), SP9 data and patches"
    - "iptsd#213 | SP8 stroke lag and low polling rate"
  fixes:
    - "url:https://github.com/user-attachments/files/30677702/highest_polling_rate.patch | Muvkina's patch (attachment in #1588), tilt and pressure still rough"
    - "AndyGozas/iptsd | branch bundle-events-workaround"
  solutions:
    - "Clean up Muvkina's patch (tilt, pressure, eraser rate) and send it as an iptsd PR with the author."
  next:
    - "Apply the patch to iptsd master, measure with evhz on the SP9, report in #1588."
  upstream: ["linux-surface/iptsd"]
  people: [Muvkina, StollD]
  depends_on: []
  related: [SP9-106, SP9-108]
  kb: ["docs/research/open-issues.md"]

