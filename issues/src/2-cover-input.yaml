- id: SP9-206
  title: "Rotation and light sensor hang in iio-sensor-proxy (claims time out, rotation freezes)"
  area: sensors
  kind: bug
  status: open
  priority: P1
  layers: {mainline: partial, linux_surface: partial, fedora: broken}
  problem: |
    With iio-sensor-proxy 3.6+ (Fedora ships 3.9) the SP9 accelerometer and light sensor claims time out,
    screen rotation freezes and `systemctl stop iio-sensor-proxy` hangs.
  origin: |
    The SAM sensor hub (045E:005D) reports accel and light only on change (in_accel_hysteresis 0.05, light 1 /
    relative 20) and surface_hid cannot fetch input reports on request, so every sysfs raw read waits 5 s when
    the tablet is still. iio-sensor-proxy 3.6+ polls these sensors on its main thread.
  reports:
    - "#2160 | iio-sensor-proxy not working (SLS); CmdrShepardsPie's SP9 analysis and udev rule"
    - "fdo:hadess/iio-sensor-proxy#432 | upstream issue (not readable from here)"
    - "#1969 | long KDE Wayland login delay from iio-sensor-proxy"
    - "#1141 | SP9 rotation only with cover attached"
  fixes: []
  solutions:
    - "udev rule setting the hub's hysteresis attributes to 0 (CmdrShepardsPie, tested on SP9 with Fedora 45); copy in docs/workarounds.md."
    - "Upstream: iio-sensor-proxy sets hysteresis 0 itself, or a hwdb property marks such sensors."
  next:
    - "Confirm on an SP9, then comment on iio-sensor-proxy#432 with the measurements, crediting CmdrShepardsPie."
  upstream: ["iio-sensor-proxy (freedesktop GitLab)", "systemd hwdb"]
  people: [CmdrShepardsPie, hadess]
  depends_on: []
  related: [SP9-207]
  kb: ["docs/workarounds.md", "status.yaml"]

- id: SP9-207
  title: "Light sensor stops after a short sleep (hid-sensor-trigger runtime PM bug)"
  area: sensors
  kind: bug
  status: open
  priority: P2
  layers: {mainline: broken, linux_surface: broken, fedora: broken}
  problem: |
    With the hysteresis rule in place, the ambient light sensor sometimes returns nothing after a short
    suspend; automatic brightness stops until it is toggled.
  origin: |
    Traced by CmdrShepardsPie with kprobes: if system suspend starts inside hid-sensor-trigger's 3 s
    autosuspend window, hid_sensor_suspend() powers the sensor off but leaves runtime PM "active"; on resume
    nothing powers it back on and hid_sensor_runtime_resume() is never called. No patch exists.
  reports:
    - "#2160 | trace and workaround attempts (2026-10-26, 2026-10-27)"
  fixes: []
  solutions:
    - "Kernel fix in drivers/iio/common/hid-sensors/hid-sensor-trigger.c: mark the device suspended in the system suspend path or re-power it on resume when the buffer is re-enabled."
  next:
    - "Reproduce on an SP9, write the patch, send to linux-iio with CmdrShepardsPie's analysis credited."
  upstream: ["linux-iio (Jiri Kosina, Srinivas Pandruvada, Jonathan Cameron)"]
  people: [CmdrShepardsPie]
  depends_on: []
  related: [SP9-206]
  kb: ["status.yaml"]

