# Type Cover, keyboard, buttons, sensors. Source for issues/SP9-2xx-*.md.

- id: SP9-201
  title: "Type Cover does not work at the LUKS passphrase prompt (dracut lacks surface_aggregator_hub)"
  area: cover
  kind: upstreaming
  status: open
  priority: P1
  layers: {mainline: works, linux_surface: works, fedora: broken}
  problem: |
    With an encrypted root, the Type Cover keyboard is dead at the LUKS prompt on Fedora, so the disk cannot
    be unlocked without a USB keyboard.
  origin: |
    The cover keyboard and touchpad are children of the SAM KIP hub, bound by `surface_aggregator_hub`.
    dracut master already installs `=drivers/hid` (surface_hid, surface_hid_core), `=drivers/tty/serial`
    (8250_dw, 8250_lpss), `=drivers/pinctrl`, `intel_lpss_pci` and `surface_aggregator_registry` in the default
    (sloppy) hostonly mode, but not `surface_aggregator_hub` (read 2026-11-14, dracut 04e04cfe). A second cause,
    the SAM probe race, is SP9-202.
  reports:
    - "#1221 | SP9 Fedora 38 LUKS with Signature Keyboard (solved with modules)"
    - "#1126 | SP9 Debian keyboard not in initramfs"
    - "#1491 | SP9 NixOS LUKS module list"
    - "#1709 | Fedora 41 LUKS keyboard (unanswered)"
    - "#2039 | SP8 Fedora: cover dead at LUKS (surface_serial_hub IRQ bug), Clevis plus TPM2 fallback"
    - "#911 | SP8 LUKS module list"
    - "#1350 | SP8 Silverblue LUKS"
    - "rhbz#1322128 | SP3/4 Type Cover at LUKS (old)"
    - "omacom/omarchy#14195 | Omarchy LUKS keyboard module list"
  fixes:
    - "commit:dracut-ng/dracut@8cc89664 | precedent: add surface_aggregator_registry for Surface Laptop 4 (Benjamin Drung, 2023)"
    - "ublue-os/surface#29 | Universal Blue initramfs module list"
    - "Madmaxx636/surface-companion | app fix with the same module list, surface_aggregator_hub included (disc#2282, 2026-11-16)"
  solutions:
    - "One-line dracut PR: add surface_aggregator_hub next to surface_aggregator_registry in 70kernel-modules, citing 8cc89664."
    - "Local workaround now: add_drivers+=\" surface_aggregator_hub \" in /etc/dracut.conf.d and regenerate."
    - "Tablet without cover: unl0kr on-screen keyboard (#1857)."
  next:
    - "Check what Fedora's initramfs contains on an SP9, then open the dracut PR."
  commands: |
    lsinitrd | grep -E 'surface|8250|pinctrl|lpss'
    printf '%s\n' 'add_drivers+=" surface_aggregator_hub "' | sudo tee /etc/dracut.conf.d/surface-hub.conf
    sudo dracut -f --regenerate-all
  upstream: ["dracut-ng/dracut"]
  people: ["Benjamin Drung"]
  depends_on: []
  related: [SP9-202, SP9-601]
  kb: ["docs/subsystems/boot-initramfs-fedora.md", "docs/research/upstream-efforts.md"]

- id: SP9-202
  title: "Type Cover dead or slow after boot: SAM probe returns -EINVAL before the pin controller is ready"
  area: cover
  kind: bug
  status: fix-pending
  priority: P1
  layers: {mainline: partial, linux_surface: works, fedora: partial}
  problem: |
    Sometimes the cover keyboard and touchpad do not work after boot (or only after reattaching or a
    suspend cycle). Discussion 2282 reports the cover taking a moment to start after attaching.
  origin: |
    When surface_aggregator probes before pinctrl_tigerlake has bound the wakeup GPIO, ssam_irq_setup()
    returns -EINVAL instead of -EPROBE_DEFER, so the probe is never retried. Wu Enqiang's v2 fix is accepted
    in platform-driver-x86 and should reach 7.5 and stable.
  reports:
    - "#2219 | surface_serial_hub -EINVAL instead of -EPROBE_DEFER (confirmed on SP9)"
    - "#1645 | SP9 NixOS keyboard dead after 6.12.4 until pinctrl_tigerlake loaded first"
    - "#1651 | SP9 keyboard and touchpad sometimes dead at boot or after resume"
    - "#2064 | keyboard not always available after boot"
    - "disc#2282 | cover takes a moment after attaching"
  fixes:
    - "lore:20261024054921.48209-1-janussss@163.com | Wu Enqiang v2, accepted in platform-driver-x86"
    - "kernel#182 | CmdrShepardsPie's variant, closed in favour of v2"
    - "lore:20240505130800.2546640-2-weifeng.liu.z@gmail.com | earlier defer-probe series (2024)"
  solutions:
    - "Until the fix is in Fedora's kernel: load pinctrl_tigerlake early (dracut force_drivers)."
  next:
    - "Check when the accepted patch reaches Fedora's kernel; ask for a kernel-ark backport if it misses 7.4."
  commands: |
    printf '%s\n' 'force_drivers+=" pinctrl_tigerlake "' | sudo tee /etc/dracut.conf.d/surface-pinctrl.conf
    sudo dracut -f --regenerate-all
  upstream: ["platform-driver-x86 (Hans de Goede, Ilpo Jarvinen)", "Fedora kernel-ark"]
  people: ["Wu Enqiang", CmdrShepardsPie]
  depends_on: []
  related: [SP9-201, SP9-203]
  kb: ["status.yaml", "data/indexes/upstream-submissions.tsv"]

- id: SP9-203
  title: "Boot stalls about 2 minutes: surface_hid probes the pen stash node and fails with -EPROTO"
  area: cover
  kind: bug
  status: open
  priority: P1
  layers: {mainline: broken, linux_surface: broken, fedora: broken}
  problem: |
    On Fedora 42/43 the SP9 sits at a black screen for about two minutes before reaching the desktop;
    blacklisting surface_hid removes the delay but also the keyboard. Possibly related to the black screen
    when booting without the cover.
  origin: |
    Mainline's ssam_node_group_sp9 lists the KIP pen stash node 01:15:02:02:00. Covers with a pen tray answer
    with HID 045E:09B0; covers without one return an empty descriptor, surface_hid fails with -EPROTO
    ("unexpected descriptor length: got 0, expected 9"). qzed: it should return -ENODEV and refuse quietly.
    Why that costs two minutes is not explained yet.
  reports:
    - "#1845 | SP9 Fedora 42 hanging on boot with surface_hid (also Fedora 43, SP3)"
    - "disc#2282 | black screen without cover until the cover is attached"
  fixes: []
  solutions:
    - "Patch surface_hid to treat an empty descriptor as -ENODEV (small upstream patch to linux-input / platform-driver-x86)."
    - "Find what blocks for two minutes (udev settle, a waiting firmware request) with systemd-analyze and a timed journal."
  next:
    - "Check an affected boot log, then write and test the patch."
  commands: |
    systemd-analyze blame | head -20
    journalctl -b -k | grep -E 'surface_hid|descriptor length'
  upstream: ["linux-input / platform-driver-x86 (Maximilian Luz)"]
  people: [qzed, AegerUSA]
  depends_on: []
  related: [SP9-202]
  kb: ["status.yaml", "docs/hardware.md"]

