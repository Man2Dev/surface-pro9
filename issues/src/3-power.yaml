- id: SP9-305
  title: "Shutdown does not power off on mainline (S5 quirk never posted upstream)"
  area: power
  kind: upstreaming
  status: open
  priority: P2
  layers: {mainline: broken, linux_surface: works, fedora: broken}
  problem: |
    On a stock kernel `poweroff` leaves the SP9 on and warm. linux-surface fixes it with a DMI-gated PCI quirk.
  origin: |
    EFI ResetSystem(EFI_RESET_SHUTDOWN) returns unless the Thunderbolt 4 and GPU PCI shutdown methods are
    skipped. linux-surface 0011 ("PCI: Add quirk to prevent calling shutdown method", SP9 + SL5) was never sent
    to linux-pci (patchwork search). Some users also need pci=hpiosize=0.
  reports:
    - "#1058 | SL5/SP9 does not power off properly"
    - "surface-shutdown#1 | SP9 still gets stuck on shutdown (fixed downstream)"
    - "#1113 | SP9 kernel panic prevents shutdown (old)"
    - "#1698 | SL6 and SP9 F41 shutdown leaves device on"
    - "#1664 | SP10 shutdown: pci=hpiosize=0"
    - "#1864 | SL6/SP11 power off: kernel parameter set"
  fixes:
    - "kb:data/indexes/patches-linux-surface-7.3.md | 0011-surface-shutdown, upstream class rework"
  solutions:
    - "Write up the root cause and propose the DMI-gated quirk (or an x86 reboot quirk) on linux-pci; ask Bjorn Helgaas what shape is acceptable."
  next:
    - "Confirm on an SP9 with the stock Fedora kernel that poweroff fails (phase 0)."
  upstream: ["linux-pci (Bjorn Helgaas)", "x86"]
  people: [qzed, CheeseFM]
  depends_on: [SP9-901]
  related: [SP9-303]
  kb: ["status.yaml"]

- id: SP9-306
  title: "Hibernate is unavailable with Secure Boot (kernel lockdown)"
  area: power
  kind: upstreaming
  status: fix-pending
  priority: P2
  layers: {mainline: broken, linux_surface: works, fedora: broken}
  problem: |
    With Secure Boot on, the kernel's lockdown disables hibernation. linux-surface carries a
    lockdown_hibernate parameter.
  origin: |
    Upstream refuses unsigned hibernation images under lockdown. Kelvie Wong's lockdown_hibernate RFC (2023-11,
    linux-surface 0001) got no follow-up. Three upstream proposals are active in 2026: Matthew Garrett's signed
    hibernation images (changes requested 2026-10), Sean Rhodes' encrypted snapshot device (v3 resend
    2026-09), and a TPM2 image encryption RFC (2026-03).
  reports:
    - "disc#2202 | suspend-then-hibernate recipe on SP9"
    - "kb:docs/research/wiki-digest.md | wiki HibernateMode=reboot note"
  fixes:
    - "url:https://patchwork.kernel.org/project/linux-pm/list/?q=lockdown&archive=both | linux-pm patchwork: Garrett, Rhodes, TPM2 RFC, Kelvie Wong RFC"
    - "kb:data/indexes/patches-linux-surface-7.3.md | 0001 lockdown_hibernate (downstream)"
  solutions:
    - "Review and test the active lockdown hibernation series instead of carrying 0001."
  next:
    - "Follow Garrett's next version; test on the SP9 when it lands in linux-next."
  upstream: ["linux-pm / LSM"]
  people: ["Matthew Garrett", "Sean Rhodes"]
  depends_on: []
  related: [SP9-307]
  kb: ["docs/research/upstream-efforts.md"]

- id: SP9-307
  title: "Type Cover dead after resume from hibernation (SAM event enable times out)"
  area: power
  kind: bug
  status: open
  priority: P2
  layers: {mainline: broken, linux_surface: broken, fedora: broken}
  problem: |
    After resuming from S4 the cover keyboard and touchpad stay dead until the cover is detached and
    reattached (SP8 report; the SP9 uses the same restore path).
  origin: |
    During restore, SAM event source enable requests time out (-110) because the EC is not ready yet. A retry
    200 ms later succeeds (pentop, tested diagnostic patch against 6.19.8).
  reports:
    - "#2294 | SP8 cover dead after hibernation, root cause and tested patch"
  fixes:
    - "#2294 | pentop's diagnostic patch (in the issue): retry failed re-enables from a work item"
  solutions:
    - "Proper fix: queue failed re-enables from ssam_serial_hub_pm_restore() to a work item, or let surface_hid re-enable its event sources on resume; send to platform-driver-x86 with pentop."
  next:
    - "Reproduce on an SP9 once hibernate works, ask pentop whether he plans to send it."
  upstream: ["platform-driver-x86 (Maximilian Luz)"]
  people: [pentop]
  depends_on: []
  related: [SP9-306, SP9-202]
  kb: ["docs/research/open-issues.md"]

- id: SP9-308
  title: "SP9 stops charging on AC (needs a UEFI battery limit toggle to recover)"
  area: battery
  kind: bug
  status: open
  priority: P2
  layers: {mainline: partial, linux_surface: partial, fedora: partial}
  problem: |
    At some point the SP9 stops charging and slowly discharges on AC (USB-C and Surface Connect alike);
    rebooting into UEFI and toggling Battery Limit on and off restores charging. Separately, the battery can
    report full while discharging.
  origin: |
    Firmware/EC charge state (Windows smart charging or the UEFI limit) that Linux cannot reset today. The
    kernel side has no control over charge modes yet (SP9-309).
  reports:
    - "#2232 | SL5 stops charging; two SP9 confirmations"
    - "#1781 | SP9 charging stopped (Windows smart charging, closed)"
    - "#1800 | not charging: turn off UEFI battery limit (SP9)"
    - "#1837 | SP9 battery shows full while discharging"
    - "#348 | battery near 50 %: UEFI limit (closed)"
    - "disc#2282 | NexGen-3D-Printing debugging the SP9 battery charge bug on Fedora 44/45 and Bazzite 45 (2026-11-16)"
  fixes:
    - "lore:20261023173215.6233-1-ramonjesusmiranda@gmail.com | surface_battery: handle battery event 0x1a (pending)"
  solutions:
    - "Workaround: UEFI Battery Limit on, boot once, off again."
    - "Use BAT 0x09/0x0a (GetUserChargeMode/SetUserChargeMode) from the Surface command headers to read and reset the mode from Linux (SP9-309)."
  next:
    - "When it happens on an SP9, capture /sys/class/power_supply/* before toggling UEFI."
    - "Ask NexGen-3D-Printing to post his logs and findings on #2232, so they sit with the other SP9 reports."
  upstream: ["platform-driver-x86 / linux-pm"]
  people: [halfnathan1200, NexGen-3D-Printing, Cloveian]
  depends_on: []
  related: [SP9-309]
  kb: ["status.yaml", "docs/research/closed-issues.md"]

- id: SP9-309
  title: "No battery charge limit or smart charging control from Linux"
  area: battery
  kind: missing-feature
  status: fix-pending
  priority: P3
  layers: {mainline: broken, linux_surface: broken, fedora: broken}
  problem: |
    The UEFI battery limit is a fixed 50 % on/off; Linux cannot set a charge limit or smart charging.
  origin: |
    No driver uses the SAM BAT charge-mode commands. Cloveian decoded them from Microsoft's
    SurfaceCommonHeadersDotNet.dll (1017 SSH commands in 36 categories) and wrote a patch using the standard
    charge_types and charge_control_end_threshold attributes.
  reports:
    - "#1580 | battery limit (qzed: 80 % limiter is EC controlled)"
  fixes:
    - "kernel#167 | smart charging and battery authentication status (petm5), qzed asked to split the charge limit out"
    - "url:https://github.com/linux-surface/kernel/compare/v7.3-surface-devel...Cloveian:kernel:battery-charge-limit | Cloveian's charge limit branch (not a PR yet)"
  solutions:
    - "Ask Cloveian to open the charge limit PR; test on the SP9; then upstream to platform-driver-x86."
  next:
    - "Test Cloveian's branch on an SP9 (registers only if BAT 0x23 and 0x09 work)."
  upstream: ["platform-driver-x86", "linux-pm (charge_types)"]
  people: [Cloveian, petm5, qzed, "Jelle van der Waa"]
  depends_on: []
  related: [SP9-308, SP9-310]
  kb: ["status.yaml", "data/indexes/branches.tsv"]

- id: SP9-310
  title: "Fan runs at high speed after using Windows (fan floor left set in SAM)"
  area: fan
  kind: bug
  status: open
  priority: P2
  layers: {mainline: broken, linux_surface: broken, fedora: broken}
  problem: |
    After Windows has run, the SP9 fan can stay around 3800 rpm at low temperature under Linux.
  origin: |
    Windows sets a minimum fan speed with SAM FAN command 0x0b (SetMinFanRpm); Linux never clears it
    (petm5's serial trace, Cloveian's decoding; FAN 0x17 reads it back).
  reports:
    - "#1726 | SP9 fan at ~3800 rpm despite low temperature"
  fixes: []
  solutions:
    - "Send FAN 0x0b with 0 at probe from surface_platform_profile (small upstream patch next to the fan standby series)."
    - "Workaround: boot Windows and let the fan stop, or send the command with the SAM debug scripts."
  next:
    - "Read FAN 0x17 on an SP9 via surface_aggregator_cdev to see if a floor is set."
  upstream: ["platform-driver-x86"]
  people: [petm5, Cloveian, "Peter Marshall"]
  depends_on: []
  related: [SP9-311, SP9-309]
  kb: ["status.yaml"]

- id: SP9-311
  title: "Fan keeps running during suspend"
  area: fan
  kind: bug
  status: fix-pending
  priority: P2
  layers: {mainline: broken, linux_surface: works, fedora: broken}
  problem: |
    If the fan is spinning when the SP9 suspends, it keeps running for a while; on Windows it always stops.
    Discussion 2282 reports it after power-button suspends without the cover.
  origin: |
    The platform profile driver does not put the fan into standby on suspend. linux-surface 7.3 carries Peter
    Marshall's fix (kernel#166); the upstream version got changes requested.
  reports:
    - "#1445 | SP9 fan still running during suspend"
    - "disc#2282 | fan keeps running after power-button suspend"
  fixes:
    - "kernel#166 | platform_profile: add fan power state handling (merged downstream 2026-11-09)"
    - "lore:20261111020916.3557508-2-pm@petermarshall.ca | upstream version, changes requested"
  solutions:
    - "Help the upstream version through review (test on SP9, reply with Tested-by)."
  next:
    - "Test on an SP9 with the linux-surface 7.3 kernel."
  upstream: ["platform-driver-x86"]
  people: ["Peter Marshall"]
  depends_on: []
  related: [SP9-310, SP9-302]
  kb: ["status.yaml"]

- id: SP9-312
  title: "No thermal tuning for the SP9 (thermald adaptive fails, no DPTF tables)"
  area: fan
  kind: missing-feature
  status: open
  priority: P3
  layers: {mainline: partial, linux_surface: partial, fedora: partial}
  problem: |
    thermald --adaptive fails on the SP9 and thermald ships no Surface configuration, so power limits and
    passive cooling are not tuned as on Windows.
  origin: |
    No DPTF tables; thermald blacklists a zone called "Surface". A hand-written thermal-conf.xml exists
    downstream.
  reports:
    - "intel/thermal_daemon#616 | Windows-style PL1 control on SB3 (open, unanswered)"
    - "disc#1734 | thermald setup"
  fixes:
    - "url:https://github.com/iwanders/nixos-surface | hand-written thermald config (thermald/)"
  solutions:
    - "Evaluate iwanders' config on the SP9; only upstream to thermald if it clearly helps."
  next:
    - "Low priority."
  upstream: ["intel/thermal_daemon"]
  people: [iwanders, larsschellhas]
  depends_on: []
  related: [SP9-310]
  kb: ["status.yaml"]
