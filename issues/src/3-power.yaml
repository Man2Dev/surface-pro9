# Power: lid wake, suspend, shutdown, hibernate, battery, fan. Source for issues/SP9-3xx-*.md.

- id: SP9-301
  title: "Opening the cover does not wake the SP9 (surface_gpe has no SP9 entry)"
  area: lid
  kind: upstreaming
  status: open
  priority: P1
  layers: {mainline: broken, linux_surface: partial, fedora: broken}
  problem: |
    Closing the cover suspends, but opening it does not wake the device; the power button is needed.
  origin: |
    The lid wake GPE (0x52) has to be armed by surface_gpe, which has entries for the SL3, SLS, SP8 and SL4
    upstream but none for the SP9 or SL5. Maximilian Luz wrote the SP9 entry (linux-surface 0012) but never
    posted it. The downstream entry matches DMI SKU Surface_Pro_9_2038 only, misses the Business SKU
    (Surface_Pro_9_for_Business_2038), and some units report sys_vendor with a leading space, which
    DMI_EXACT_MATCH rejects.
  reports:
    - "disc#2282 | opening the cover does not wake the device"
    - "#2257 | DMI sys_vendor has a leading space on some SP9 units"
    - "#1919 | surface_gpe finds no compatible device on SP9"
    - "#1183 | SP9 cannot wake after closing the cover"
    - "#1224 | SP9 does not wake from suspend"
    - "#1910 | SP9 NixOS cannot wake"
    - "surface-gpe#3 | SP9 Business lid wake"
    - "kbz#218923 | ACPI error storm and resume failure on lid close (SP9)"
  fixes:
    - "#2011 | contains Maximilian Luz's 'gpe: Add support for Surface Pro 9 and Surface Laptop 5' (moved to kernel#162)"
    - "surface-gpe#7 | tolerate the vendor string"
    - "surface-gpe#5 | add the Business SKU"
    - "gist:dragged9698/3d520d6da566825e9880a7e8e0c7abfc | DMI_MATCH vendor patch, verified on SP9 2038"
    - "Meatwo310/dotnix#13 | Business SKU string, lid suspend and resume verified"
    - "lore:20220429180049.1282447-1-luzmaximilian@gmail.com | precedent: gpe support for Surface Pro 8 (accepted 2022)"
  solutions:
    - "One upstream surface_gpe patch: SP9 (all SKUs, tolerant vendor match) plus SL5, GPE 0x52, Maximilian Luz as author if he agrees; rebase on Bartosz Golaszewski's 2026 platform_device conversion."
  next:
    - "Read DMI strings on an SP9, ask qzed about authorship, build and test, send to platform-driver-x86."
  commands: |
    sudo dmidecode -s system-sku-number
    sudo dmidecode -s system-manufacturer | od -c | head -2
    grep . /sys/firmware/acpi/interrupts/gpe52
  upstream: ["platform-driver-x86 (Hans de Goede, Ilpo Jarvinen, Maximilian Luz)"]
  people: [qzed, dragged9698, 777HOST, Lucrtz, Meatwo310]
  depends_on: []
  related: [SP9-302, SP9-303]
  kb: ["status.yaml", "docs/research/upstream-efforts.md", "data/indexes/external-repos.yaml"]

- id: SP9-302
  title: "SP9 sometimes does not wake from s2idle (or hangs on the second suspend)"
  area: suspend
  kind: bug
  status: open
  priority: P1
  layers: {mainline: partial, linux_surface: partial, fedora: partial}
  problem: |
    Intermittently the SP9 does not resume from s2idle; only a long power-button press helps. Several users
    report it gets worse when the cover is opened or closed during suspend.
  origin: |
    Not settled. Two concrete leads from the Surface Laptop 5 (same Alder Lake-P platform):
    (1) the SOF audio DSP 8086:51c8 stays in D0 after the first resume and the second suspend hangs; forcing
    legacy HDA (snd_intel_dspcfg.dsp_driver=1) fixed it (#1010); the SP9 has the same audio controller.
    (2) INTC1055 pin 213 PADCFG0 gets corrupted in s2idle and fires GPE 0x52 (kernel#162), the SP9 lid GPE.
    History: Intel Thread Director patches once broke wake on ADL and were removed (#1120).
  reports:
    - "disc#2282 | power-button suspend without cover sometimes incomplete, fan keeps running"
    - "#1164 | SP9 cannot turn on when suspended"
    - "#1224 | SP9 won't wake from suspend"
    - "#1910 | SP9 wake fails if the lid moves during suspend"
    - "#1811 | SP9 disable lid open/close handling"
    - "#1805 | SL5 and SP9 cannot wake after update"
    - "#1684 | SP9 cannot wake from sleep (closed)"
    - "#1010 | SL5 sleep: SOF DSP root cause and dsp_driver=1 fix"
    - "kbz#216854 | SL5 trouble waking by opening the lid"
    - "kernel#192 | SP7 s2idle hard freeze since 2026-11-12 (watch for SP9)"
  fixes:
    - "kernel#162 | SL5 s2idle fix module (PADCFG0 repair), stalled; qzed prefers userspace"
    - "#1120 | Thread Director patches removed (history)"
  solutions:
    - "Test lead 1 on the SP9 with an rtcwake loop and dsp_driver=1; if it holds, report to SOF instead of keeping the parameter."
    - "Test lead 2 by reading PADCFG0 of pin 213 before and after s2idle (kernel#162 has the method)."
    - "Workaround reported on SL5: logind lid handling off plus pci=hpiosize=0."
  next:
    - "Run the rtcwake loop with and without dsp_driver=1 on an SP9 (commands in docs/testing.md)."
  commands: |
    for i in 1 2 3; do sudo rtcwake -m mem -s 20; sleep 15; done
    grep . /sys/power/suspend_stats/*
  upstream: ["thesofproject/linux", "linux-gpio (Intel pinctrl: Andy Shevchenko, Mika Westerberg)"]
  people: [User25665, wowitsjack, dmusican]
  depends_on: []
  related: [SP9-301, SP9-303, SP9-304, SP9-311, SP9-103]
  kb: ["status.yaml", "docs/research/open-issues.md", "docs/testing.md"]

- id: SP9-303
  title: "ACPI GPE interrupt storm on lid close with AC (pci=hpiosize=0 trade-off)"
  area: suspend
  kind: bug
  status: open
  priority: P2
  layers: {mainline: partial, linux_surface: partial, fedora: partial}
  problem: |
    Closing the cover while on AC (also Thunderbolt hotplug, lid resume) floods dmesg with ACPI errors and
    can break later suspends. The wiki workaround pci=hpiosize=0 stops it, but an SP9 user reports that it
    then also stops lid wake.
  origin: |
    Unknown; hpiosize=0 changes the PCI hotplug I/O window. Same family as kbz#218923.
  reports:
    - "#1082 | SP9 ACPI error spam after closing the cover on AC; trade-off reported 2025-10"
    - "#1446 | SP9 ACPI errors during sleep (TLP plus surface_gpe blacklist)"
    - "kbz#218923 | ACPI error storm and resume failure (SP9)"
  fixes: []
  solutions:
    - "Find what the I/O window change fixes (ACPI tables, hotplug bridge resources) and file it on bugzilla.kernel.org / linux-pci."
    - "Test lid wake with and without hpiosize=0 once SP9-301 is fixed."
  next:
    - "Capture /sys/firmware/acpi/interrupts and dmesg on lid close with AC, with and without hpiosize=0."
  upstream: ["linux-pci", "linux-acpi"]
  people: [petm5, gtxg16]
  depends_on: []
  related: [SP9-301, SP9-302, SP9-305]
  kb: ["status.yaml", "docs/research/wiki-digest.md"]

