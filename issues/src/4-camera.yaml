- id: SP9-405
  title: "Cameras unusable in browsers and video calls without workarounds (v4l2loopback, 64-node limit)"
  area: camera
  kind: bug
  status: open
  priority: P2
  layers: {mainline: partial, linux_surface: partial, fedora: partial}
  problem: |
    Browsers and Zoom/Teams do not see libcamera cameras directly; people use v4l2loopback or relays, and
    intel-ipu6-isys registers 64 video nodes, which pushes a loopback device past WebRTC's limit.
  origin: |
    IPU6 needs libcamera; apps need PipeWire camera support (Firefox/Chromium flags) or a V4L2 bridge.
  reports:
    - "#2242 | V4L2 64-device limit drops the loopback camera"
    - "#1893 | SP8 front camera in Firefox and Chromium through PipeWire on a stock kernel"
    - "disc#2198 | relay and loopback recipes"
  fixes:
    - "luqqas96/surface-zoom-bridge | LD_PRELOAD shim and dual loopback bridge"
  solutions:
    - "Prefer the PipeWire camera portal (Firefox media.webrtc.camera.allow-pipewire, Chromium flag); document it for Fedora."
  next:
    - "Test PipeWire camera access in Firefox on an SP9 once SP9-401 works."
  upstream: ["PipeWire / browsers"]
  people: [luqqas96, nicheosala]
  depends_on: [SP9-401]
  related: [SP9-402]
  kb: ["docs/subsystems/camera.md"]

- id: SP9-406
  title: "Camera fails to re-probe after intel-ipu6 reload or hibernate"
  area: camera
  kind: bug
  status: fix-pending
  priority: P3
  layers: {mainline: broken, linux_surface: broken, fedora: broken}
  problem: |
    After unloading and reloading intel-ipu6, or after hibernation, ov5693 does not probe again.
  origin: |
    ipu-bridge software nodes reference the module image and are not reusable on rebind.
  reports:
    - "disc#2202 | camera re-probe bug after resume"
  fixes:
    - "lore:20261026082549.662885-2-dmanresa@gmail.com | ipu-bridge: survive module unload (D. Manresa v5, author cannot respin)"
  solutions:
    - "Test v5 on the SP9 and reply with Tested-by; someone may need to carry later versions."
  next:
    - "Low priority."
  upstream: ["linux-media"]
  people: ["D. Manresa"]
  depends_on: []
  related: [SP9-401, SP9-306]
  kb: ["status.yaml"]
