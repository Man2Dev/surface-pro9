# External (non linux-surface org) projects and personal repos that matter for the Surface Pro 9 goal.
# Sources: every URL in the bodies and comments of 1301 org issues/PRs (SP9, SP8 and subsystem searches), 308 of 319
# discussions, the wiki, fork READMEs and fork commit messages, patch Link tags. Snapshot 2026-11-13.
# Second pass (2026-11-13): GitHub repository and issue search outside the org; entries marked "added 2026-11-13". Bug trackers and mailing lists: data/indexes/trackers.tsv.
# Raw link aggregation: data/generated/urls-local-sources.json (local sources); clone facts: data/generated/external-repos-inspect.json (second pass: external-repos-inspect-2.json).
# sp9: core (directly usable for SP9), useful (same hardware or a Fedora/packaging pattern to copy), reference (method, data, history).
# upstream_value: what it can contribute upstream, if anything. mentions: where it is referenced (#N = linux-surface issue/PR, D = discussion).
# last = last commit seen in a depth-30 clone. Repos that no longer exist: listed at the bottom.

cameras:
  - repo: fildunsky/linux-surface-pro8-cameras
    sp9: core
    last: 2026-10-16
    what: "All three SP8 cameras (same sensors as SP9) on mainline + linux-surface: front OV5693 (INT33BE), rear OV13858 (OVTID858), IR VD55G0 (ACPI SMO55F0, 644x604 mono ~31 fps). DKMS for ov5693, ov13858, ipu-bridge; v4l2-relayd basetime patch; tuning tools (decode_aiqb.py, factory-tuning.py, camera-tune.py); IR face auth notes."
    upstream_value: "libcamera software-ISP patches (agc gain floor, proportional AGC, AWB via libipa bayes, black-level order fix, split AWB from CCM, stats sums to 8 bit) and OV5693/OV13858 tuning files: candidates for libcamera upstream. Upstream libcamera has sensor helpers for ov5693 and ov13858 but only uncalibrated.yaml for the soft ISP."
    mentions: [kernel#169, "#2227", "#2166", "#2153", "#2171", "#2252"]
